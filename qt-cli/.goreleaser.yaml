# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: qtcli
builds:
  - id: qtcli
    dir: ./src
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s # strip symbol table
      - -w # strip DWARF debugging information
      - -X main.version={{ .Version }}
    binary: >-
      qtcli-
      {{- if eq .Os "linux" }}ubuntu
      {{- else if eq .Os "darwin" }}macos
      {{- else }}{{ .Os }}{{- end }}-
      {{- .Arch }}-
      {{- .Version }}/qtcli
    no_unique_dist_dir: true
    ignore:
      - goos: linux
        goarch: arm64
      - goos: windows
        goarch: arm64

universal_binaries:
  - name_template: qtcli
    hooks:
      post: mv {{ .Path | dir }} dist/qtcli-macos-fat-{{- .Version }}/

snapshot:
  version_template: '{{ .Version }}'

checksum:
  disable: true

archives:
  - format: binary
