name: Qt VS Code Ext Tests

# Triggers: run automatically on every PR,
# and also allow manual runs from the Actions tab
on:
  pull_request:
  workflow_dispatch:
    inputs:
        debug:
          description: 'Enable test debug mode (QT_TEST_DEBUG): 0=quiet, 1=extra info, 2=show all'
          required: false
          default: '1'
        natvis_show_summary:
          description: 'Show Qt types NatVis coverage summary (NATVIS_SHOW_SUMMARY=1)'
          required: false
          default: '0'
        qt_version_for_test:
          description: 'Qt version to install (ex: 6.9.0, 6.10.0)'
          required: false
          default: '6.10.1'
        test_suite:
          description: 'Which extension tests to run'
          required: false
          default: 'all'
          type: choice
          options:
            - all
            - qt-core
            - qt-cpp
            - qt-qml
            - qt-python
            - qt-csharp

jobs:
  tests:
    # Job name will show up in GitHub UI as "tests (ubuntu-latest)" etc.
    name: tests (${{ matrix.os }}, Qt ${{ github.event_name == 'workflow_dispatch' && inputs.qt_version_for_test || '6.9.2' }}, suite ${{ github.event_name == 'workflow_dispatch' && inputs.test_suite || 'all' }})
    # Run this job on Linux, macOS, and Windows
    runs-on: ${{ matrix.os }}
    # Default shell for all `run:` commands in this job
    defaults:
      run:
        shell: bash
    strategy:
      # Do not cancel other jobs if one platform fails.
      # This way you see all failures at once.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Ubuntu : gdb (cppdbg)
        # macOS  : lldb (cppdbg)
        # Windows: cppvsdbg
    env:
      QT_VERSION_FOR_TEST: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.qt_version_for_test || '6.9.2' }}
      VSCODE_LOG_LEVEL: error # trace, debug, info, warn, error, off
      QT_TEST_DEBUG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.debug || '' }}
      NATVIS_SHOW_SUMMARY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.natvis_show_summary || '' }}
      DBUS_SESSION_BUS_ADDRESS: "disabled:"
      NO_AT_BRIDGE: "1"
      TEST_SUITE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.test_suite || 'all' }}

    steps:
      # Check out your branch code into the runner
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: true

      # Set up Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      # Needed by runTest.mts fallback to download Marketplace extensions
      - name: Install vsce
        run: npm i -g @vscode/vsce

      # Install dependencies using package-lock.json
      - name: Install deps (all packages)
        run: npm run ci:all_sync

      # Build qt-core so we have a .vsix for tests
      - name: Build qt-lib first (dependency)
        run: |
          npm run compile:qt-lib

      # Ensure qt-core has a qt-cli binary in res/qtcli for tests
      - name: Build qtcli (host platform)
        uses: ./.github/actions/build-qtcli
        with:
          working-directory: ./qt-cli
          deploy-target: ./qt-core/res/qtcli
          skip-upload: 'true'

      # Package qt-core so qt-cpp tests can install its .vsix via getLocalQtCore()
      - name: Package qt-core (.vsix)
        run: npm run package:qt-core
      # Prepare NatVis files (run from repo root — generates qt-cpp/res/natvis/qt6.natvis)
      - name: Prepare NatVis files
        run: npm run prepareNatvisFiles
      # Compile other extensions once (runtime build)
      - name: Compile qt-cpp / qt-qml / qt-python / qt-csharp
        run: |
          npm --prefix qt-cpp run compile
          npm --prefix qt-qml run compile
          npm --prefix qt-python run compile
          npm --prefix qt-csharp run compile


      # Install Qt using a community-maintained action.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION_FOR_TEST }}
          host:   ${{ matrix.os == 'windows-latest' && 'windows' ||
                    matrix.os == 'macos-latest'   && 'mac'      || 'linux' }}
          target: desktop
          arch:   ${{ matrix.os == 'windows-latest' && 'win64_msvc2022_64' ||
                    matrix.os == 'macos-latest'   && 'clang_64'          || 'linux_gcc_64' }}
          modules: ${{ matrix.os == 'windows-latest' && 'debug_info' || '' }}
          dir: ${{ github.workspace }}
          cache: true

      - name: Set QT_TEST_QT_ROOT (and show Qt install overview)
        shell: bash
        run: |
          set -euo pipefail
          QT_ROOT="${{ github.workspace }}/Qt"
          echo "QT_TEST_QT_ROOT=$QT_ROOT" >> "$GITHUB_ENV"

          echo "QT_VERSION_FOR_TEST=${QT_VERSION_FOR_TEST}"
          echo "Qt root: $QT_ROOT"

          echo "Top-level under $QT_ROOT:"
          ls -la "$QT_ROOT" || true

          echo "Directory tree (maxdepth 3) under $QT_ROOT:"
          find "$QT_ROOT" -maxdepth 3 -type d -print

      - name: Verify Designer is available qt-core only)
        if: env.TEST_SUITE == 'all' || env.TEST_SUITE == 'qt-core'
        shell: bash
        run: |
          set -euo pipefail
          QT_ROOT="${{ github.workspace }}/Qt"

          DESIGNER="$(/usr/bin/find "$QT_ROOT" -type f \( -name Designer -o -name designer -o -name designer.exe \) \
                      -path '*/bin/*' -print -quit || true)"
          echo "looking for Designer under $DESIGNER"

          if [[ -n "$DESIGNER" ]]; then
            echo "Found Designer at: $DESIGNER"
          else
            echo "::error::Designer not found under $QT_ROOT after install, but qt-core tests were selected."
            exit 1
          fi

      - name: Ensure gdb is installed (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          if command -v gdb >/dev/null 2>&1; then
            echo "gdb already installed"
          else
            echo "gdb not found — installing"
            sudo apt-get update
            sudo apt-get install -y gdb
          fi

      - name: Run tests (all OS-selected suites)
        shell: bash
        run: |
          set -euo pipefail
          echo "  Qt6_DIR=${Qt6_DIR:-<unset>}"

          echo "QT_TEST_DEBUG=${QT_TEST_DEBUG:-0}"
          echo "TEST_SUITE=${TEST_SUITE:-all}"

          # Hide these noisy lines (match after stripping ANSI, but print original so colors stay)
          FILTER='^(NativeExtensionHostFactory[.:]|Settings Sync:|\\[CMakeTools\\]|workbench#open\(\))|.*ERROR:dbus|.*viz_main_impl|.*ERROR:gpu/'

          run_cmd() {
            debug_level="${QT_TEST_DEBUG:-0}"        # default = 0
            if [[ "$debug_level" == "2" ]]; then
              "$@"
            else
              # 1) merge stderr  2) strip ANSI only for matching  3) print original (colored) if not matched
              "$@" 2>&1 | awk -v pat="$FILTER" '
                function strip_ansi(s){ gsub(/\x1B\[[0-9;]*[A-Za-z]/, "", s); return s }
                {
                  raw=$0
                  line=$0
                  gsub(/\r/, "", line)         # drop CR to avoid partial-line mismatches
                  if ( strip_ansi(line) ~ pat ) next
                  print raw
                  fflush()
                }'
            fi
          }

          should_run() {
            suite="$1"
            selected="${TEST_SUITE:-all}"
            [[ "$selected" == "all" || "$selected" == "$suite" ]]
          }

          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            XVFB=(xvfb-run -a -s "-screen 0 1280x720x24")

            if should_run qt-core; then
              run_cmd "${XVFB[@]}" npm --prefix qt-core run test:only
            fi

            if should_run qt-cpp; then
              run_cmd "${XVFB[@]}" npm --prefix qt-cpp run test:only
            fi

            if should_run qt-qml; then
              run_cmd "${XVFB[@]}" npm --prefix qt-qml run test:only
            fi

            if should_run qt-python; then
              run_cmd "${XVFB[@]}" npm --prefix qt-python run test:only
            fi

            if should_run qt-csharp; then
              run_cmd "${XVFB[@]}" npm --prefix qt-csharp run test:only
            fi
          else
            if should_run qt-core; then
              run_cmd npm --prefix qt-core run test:only
            fi

            if should_run qt-cpp; then
              run_cmd npm --prefix qt-cpp run test:only
            fi

            if should_run qt-qml; then
              run_cmd npm --prefix qt-qml run test:only
            fi

            if should_run qt-python; then
              run_cmd npm --prefix qt-python run test:only
            fi

            if should_run qt-csharp; then
              run_cmd npm --prefix qt-csharp run test:only
            fi
          fi
