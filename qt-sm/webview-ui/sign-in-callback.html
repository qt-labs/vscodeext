    :root {
      --bg: #1f1f1f;
      --card: #262626;
      --border: #3f3f3f;
      --text: #f2f2f2;
      --text-2: #aeaeae;
      --success: #2cb67d;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #fcfcfc;
        --card: #ffffff;
        --border: #cdcdcd;
        --text: #2d2d2d;
        --text-2: #595959;
        --success: #157a49;
      }
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html,
    body {
      height: 100%
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font: 400 14px/1.5 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }

    main {
      width: 100%;
      max-width: 560px;
      text-align: center;
      padding: 48px 32px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .18);
    }

    svg {
      display: block;
      margin: 0 auto 24px;
      width: 56px;
      height: 56px
    }

    h1 {
      font: 600 24px/1.2 "Titillium Web", Inter, system-ui, sans-serif;
      margin-bottom: 8px
    }

    p {
      color: var(--text-2);
      font-size: 15px
    }
  </style>
</head>
