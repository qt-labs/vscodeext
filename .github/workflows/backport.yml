name: Backport

on:
  # Backporting requires write permissions and a pull_request_target trigger.
  # The steps only run on merged pull requests, so the backported changes
  # have already been reviewed. No code from the pull request is executed.
  pull_request_target:
    types: [closed, labeled]

permissions:
  contents: read

jobs:
  backport:
    name: Backport pull request
    permissions:
      contents: read
      # GITHUB_TOKEN approves the backport pull requests
      pull-requests: write
    if: >
      github.repository == 'qt-labs/vscodeext' &&
      github.event.pull_request.merged == true &&
      (github.event.action != 'labeled' ||
       startsWith(github.event.label.name, 'backport '))
    runs-on: ubuntu-latest
    steps:
      # Pull requests opened with GITHUB_TOKEN do not start the CI workflows,
      # so the backport pull requests are opened by a GitHub App.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BACKPORT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BACKPORT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
      - name: Create backport pull requests
        id: backport
        uses: korthout/backport-action@v4
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          # Only release branches such as 1.17.1 can be targeted.
          label_pattern: '^backport (\d+\.\d+\.\d+)$'
          pull_title: '[${target_branch}] ${pull_title}'
          pull_description: |-
            Automatic backport to `${target_branch}`, triggered by a label in #${pull_number}.
          copy_labels_pattern: '^(?!backport ).*'
          # The pull request is merged once it is approved and the required
          # checks pass.
          auto_merge_enabled: true
          auto_merge_method: rebase
      # The app opened the pull requests, so GITHUB_TOKEN can approve them.
      # Only the pull requests created by this job are approved.
      - name: Approve backport pull requests
        if: steps.backport.outputs.created_pull_numbers != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PULLS: ${{ steps.backport.outputs.created_pull_numbers }}
        run: |
          for pull in $PULLS; do
            gh pr review "$pull" --approve --repo "$GITHUB_REPOSITORY" \
              --body "Clean backport of an approved pull request."
          done
