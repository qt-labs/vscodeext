version: "1"
type: project
files:
  - in: CMakeLists.txt
  - in: main.cpp
  - in: mainwindow.cpp
  - in: mainwindow.h

  - in: mainwindow.ui
    when: '{{ .useForm }}'

  - in: '@/common/file.ts'
    out: '{{ .name }}_{{ .language }}.ts'
    when: '{{ .useTranslation }}'

  - in: '@/common/git.ignore'
    out: .gitignore
    bypass: true
